<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="description" content="Moonward — Mission Control Adventure. Plan lunar surface work, compare sites and sunlight windows, and make a call you can defend. NASA Space Apps 2026, using JPL Horizons and LOLA data.">
		<meta property="og:title" content="Moonward — Mission Control Adventure">
		<meta property="og:description" content="Plan the light. Read the sky. Make the call. Compare lunar sites and sunlight windows with JPL Horizons and LOLA data.">
		<meta property="og:type" content="website">
		<meta name="theme-color" content="#05060a">
		<title>Moonward — Mission Control Adventure</title>
		<style>
:root {
	--void: #05060a;
	--bone: #e8e2d4;
	--dim: #8f8a80;
	--kapton: #e0a43a;
	--warn: #e2604a;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: var(--bone);
	background-color: var(--void);
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	padding: 1.5rem;
	box-sizing: border-box;
	background: radial-gradient(circle at 50% 120%, #1a1712 0%, var(--void) 60%);
	text-align: center;
}

#title {
	margin: 0;
	font-size: clamp(2.2rem, 9vw, 4.5rem);
	font-weight: 300;
	letter-spacing: 0.35em;
	padding-left: 0.35em; /* balance the trailing letter-spacing */
	color: var(--bone);
}

#title span {
	color: var(--kapton);
}

#tagline {
	margin: 0;
	max-width: 32rem;
	color: var(--dim);
	font-size: 0.95rem;
	line-height: 1.5;
}

#bar {
	width: min(22rem, 80vw);
	height: 4px;
	border-radius: 2px;
	background: #2a2721;
	overflow: hidden;
}

#bar-fill {
	width: 0%;
	height: 100%;
	background: var(--kapton);
	transition: width 0.2s ease-out;
}

#bar.indeterminate #bar-fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite;
}

@keyframes sweep {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#progress-text {
	min-height: 1.2em;
	color: var(--dim);
	font-size: 0.8rem;
	font-variant-numeric: tabular-nums;
}

#notice {
	display: none;
	max-width: 30rem;
	padding: 1rem 1.25rem;
	border: 1px solid var(--warn);
	border-radius: 0.5rem;
	background: #2a1512;
	line-height: 1.5;
	text-align: left;
}

#notice strong {
	color: var(--warn);
}

#links {
	font-size: 0.8rem;
	color: var(--dim);
}

#links a {
	color: var(--bone);
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Moonward needs JavaScript and WebGL 2 to run.
		</noscript>

		<div id="status">
			<h1 id="title">MOON<span>WARD</span></h1>
			<p id="tagline">Mission Control Adventure<br>Plan the light. Read the sky. Make the call.</p>
			<div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
			<div id="progress-text">Loading…</div>
			<div id="notice" role="alert"></div>
			<div id="links">
				NASA Space Apps 2026 ·
				<a href="https://github.com/zero0no1one/GitCantCommit_NASA/blob/main/CREDITS.md" target="_blank" rel="noopener">Credits &amp; data sources</a>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":38146268,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const progressText = document.getElementById('progress-text');
	const notice = document.getElementById('notice');

	function showNotice(title, lines) {
		bar.style.display = 'none';
		progressText.style.display = 'none';
		notice.textContent = '';
		const strong = document.createElement('strong');
		strong.textContent = title;
		notice.appendChild(strong);
		lines.forEach((line) => {
			notice.appendChild(document.createElement('br'));
			notice.appendChild(document.createTextNode(line));
		});
		notice.style.display = 'block';
	}

	function fail(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		showNotice('Moonward could not start.', msg.split('\n').concat(['Try reloading the page, or a current Chrome, Edge, Firefox or Safari.']));
	}

	function hasWebGL2() {
		try {
			const c = document.createElement('canvas');
			return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
		} catch (e) {
			return false;
		}
	}

	if (!hasWebGL2()) {
		showNotice('WebGL 2 is not available.', [
			'Moonward draws its 3D Moon with WebGL 2, which this browser or device has turned off or does not support.',
			'Turn on hardware acceleration in your browser settings, or open the link in a current Chrome, Edge, Firefox or Safari.',
		]);
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showNotice('This browser is missing features Moonward needs:', missing);
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('indeterminate');
				barFill.style.width = (100 * current / total).toFixed(1) + '%';
				progressText.textContent = 'Loading… ' + (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
			} else {
				bar.classList.add('indeterminate');
			}
		},
	}).then(() => {
		statusOverlay.remove();
	}, fail);
}());
		</script>
	</body>
</html>
