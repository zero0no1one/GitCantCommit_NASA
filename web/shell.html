<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="description" content="Sunline: choose a lunar landing site and touchdown time that give your rover six hours of full sunlight. Built for NASA Space Apps 2026 with JPL Horizons and LOLA data.">
		<meta name="theme-color" content="#05060a">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--void: #05060a;
	--bone: #e8e2d4;
	--dim: #8f8a80;
	--kapton: #e0a43a;
	--warn: #e2604a;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: var(--bone);
	background-color: var(--void);
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	padding: 1.5rem;
	box-sizing: border-box;
	background: radial-gradient(circle at 50% 120%, #1a1712 0%, var(--void) 60%);
	text-align: center;
}

#title {
	margin: 0;
	font-size: clamp(2.2rem, 9vw, 4.5rem);
	font-weight: 300;
	letter-spacing: 0.35em;
	padding-left: 0.35em; /* balance the trailing letter-spacing */
	color: var(--bone);
}

#title span {
	color: var(--kapton);
}

#tagline {
	margin: 0;
	max-width: 32rem;
	color: var(--dim);
	font-size: 0.95rem;
	line-height: 1.5;
}

#bar {
	width: min(22rem, 80vw);
	height: 4px;
	border-radius: 2px;
	background: #2a2721;
	overflow: hidden;
}

#bar-fill {
	width: 0%;
	height: 100%;
	background: var(--kapton);
	transition: width 0.2s ease-out;
}

#bar.indeterminate #bar-fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite;
}

@keyframes sweep {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#progress-text {
	min-height: 1.2em;
	color: var(--dim);
	font-size: 0.8rem;
	font-variant-numeric: tabular-nums;
}

#notice {
	display: none;
	max-width: 30rem;
	padding: 1rem 1.25rem;
	border: 1px solid var(--warn);
	border-radius: 0.5rem;
	background: #2a1512;
	line-height: 1.5;
	text-align: left;
}

#notice strong {
	color: var(--warn);
}

#links {
	font-size: 0.8rem;
	color: var(--dim);
}

#links a {
	color: var(--bone);
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Sunline needs JavaScript and WebGL 2 to run.
		</noscript>

		<div id="status">
			<h1 id="title">SUN<span>LINE</span></h1>
			<p id="tagline">Six hours of sunlight. Choose where and when to land.</p>
			<div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
			<div id="progress-text">Loading…</div>
			<div id="notice" role="alert"></div>
			<div id="links">
				NASA Space Apps 2026 ·
				<a href="https://github.com/zero0no1one/GitCantCommit_NASA/blob/main/CREDITS.md" target="_blank" rel="noopener">Credits &amp; data sources</a>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const progressText = document.getElementById('progress-text');
	const notice = document.getElementById('notice');

	function showNotice(title, lines) {
		bar.style.display = 'none';
		progressText.style.display = 'none';
		notice.textContent = '';
		const strong = document.createElement('strong');
		strong.textContent = title;
		notice.appendChild(strong);
		lines.forEach((line) => {
			notice.appendChild(document.createElement('br'));
			notice.appendChild(document.createTextNode(line));
		});
		notice.style.display = 'block';
	}

	function fail(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		showNotice('Sunline could not start.', msg.split('\n').concat(['Try reloading the page, or a current Chrome, Edge, Firefox or Safari.']));
	}

	function hasWebGL2() {
		try {
			const c = document.createElement('canvas');
			return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
		} catch (e) {
			return false;
		}
	}

	if (!hasWebGL2()) {
		showNotice('WebGL 2 is not available.', [
			'Sunline draws its 3D Moon with WebGL 2, which this browser or device has turned off or does not support.',
			'Turn on hardware acceleration in your browser settings, or open the link in a current Chrome, Edge, Firefox or Safari.',
		]);
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showNotice('This browser is missing features Sunline needs:', missing);
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('indeterminate');
				barFill.style.width = (100 * current / total).toFixed(1) + '%';
				progressText.textContent = 'Loading… ' + (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
			} else {
				bar.classList.add('indeterminate');
			}
		},
	}).then(() => {
		statusOverlay.remove();
	}, fail);
}());
		</script>
	</body>
</html>
