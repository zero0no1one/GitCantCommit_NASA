[runnable_presets]

Web="Web"

[preset.0]

name="Web"
platform="Web"
dedicated_server=false
custom_features="procedural_models"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="addons/*, assets/models/astronaut.glb, assets/models/astronaut_suit*, assets/models/scanner*, assets/models/rover*, assets/models/beacon*, assets/models/lander*, assets/models/rocks*, assets/models/procedural/astronaut*, assets/models/procedural/rover*, assets/models/procedural/beacon*, assets/models/procedural/scanner*, assets/models/earth*, assets/models/sun_disc*, assets/textures/*, assets/team/models/astronaut*, assets/team/scenes/astronaut.tscn, assets/team/materials/*, tools/*, blender/*, web/*, tests/*"
export_path="build/web/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.0196, 0.0235, 0.0392, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
